name: release
# Redivis: releases the version in redivis/VERSION whenever it changes on main, as Redivis's Python and R libraries do.
#   If there's no tag for that version yet, this builds the readstat and extract_metadata binaries for linux/amd64 and
#   linux/arm64 with redivis/build.sh, then creates the tag and a GitHub release with them attached, which Redivis's app
#   image downloads. Versions that are already tagged are skipped, so a failed run can safely be re-run. Pull requests
#   build and test the binaries too. See redivis/README.md
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Releases happen one at a time, in the order they're merged
concurrency:
  group: release-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: version
        name: Check whether this version has been released
        run: |
          version=$(tr -d '[:space:]' < redivis/VERSION)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::redivis/VERSION must be a version like 1.2.3, not '$version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
          # Exits with 2 if there's no such tag, or with another code if it couldn't check
          elif git ls-remote --exit-code --tags "https://github.com/$GITHUB_REPOSITORY" "refs/tags/$version" > /dev/null; then
            echo "$version has already been released"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            status=$?
            if [ "$status" -ne 2 ]; then exit "$status"; fi
            echo "Releasing $version"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      # Before anything is built, so that a version is never released without notes
      - name: Check redivis/CHANGELOG.md has notes for this version
        run: |
          awk -v heading="## ${{ steps.version.outputs.version }}" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' redivis/CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::redivis/CHANGELOG.md has no section for ${{ steps.version.outputs.version }}"
            exit 1
          fi

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    # Debian trixie, as in Redivis's app image, pinned by digest
    container: debian:trixie@sha256:2dc419c6d7fe3dad0a2f9fd469c34cc90b0f9ba642d8fde837fe3d7d34a0e7f1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        run: redivis/build.sh "${{ needs.check.outputs.version }}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: readstat-${{ matrix.runner }}
          path: dist/
          if-no-files-found: error

  release:
    needs: [check, build]
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Create the tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          # Notes are this version's section of redivis/CHANGELOG.md, followed by GitHub's generated list of changes
          awk -v heading="## $VERSION" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' redivis/CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          gh release create "$VERSION" dist/* \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --generate-notes
